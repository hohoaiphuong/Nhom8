<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Bán Sách & Danh sách Sinh Viên</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Thêm chút CSS cho bảng sinh viên đẹp hơn cho hợp với web của Fat */
        .student-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .student-table th, .student-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        .student-table th {
            background-color: #f4f4f4;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-auth-column">
                    <div class="logo">
                        <img src="img/logo.jpg" alt="Logo Cửa Hàng Sách" class="logo-img">
                    </div>
                    <div class="auth-section">
                        <button class="btn-login" onclick="login()">Đăng nhập</button>
                        <button class="btn-register" onclick="register()">Đăng ký</button>
                        <button class="btn-logout" onclick="logout()" style="display: none;">Đăng xuất</button>
                    </div>
                </div>
                
                <div class="search-box">
                    <form action="/search" method="get">
                        <input type="text" name="query" placeholder="Tìm kiếm sách..." class="search-input">
                        <button type="submit" class="search-btn">Tìm kiếm</button>
                    </form>
                </div>
                
                <div class="icons-section">
                    <div class="icon-item">
                        <button class="icon-btn" onclick="showWishlist()" title="Danh sách yêu thích">
                            ♥ Yêu thích
                            <span class="badge" id="wishlist-count">0</span>
                        </button>
                    </div>
                    <div class="icon-item">
                        <button class="icon-btn" onclick="showCart()" title="Giỏ hàng">
                            🛒 Giỏ hàng
                            <span class="badge" id="cart-count">0</span>
                        </button>
                    </div>
                    <div class="icon-item">
                        <button class="icon-btn" onclick="showOrders()" title="Lịch sử đơn hàng">
                            📋 Đơn hàng
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        
        <section style="margin-top: 30px; margin-bottom: 50px;">
            <h2>Danh sách Sinh viên (Nhóm 8)</h2>
            <table class="student-table">
                <thead>
                    <tr>
                        <th style="width: 100px; text-align: center;">ID</th>
                        <th>Họ và Tên</th>
                    </tr>
                </thead>
                <tbody id="du-lieu">
                    </tbody>
            </table>
        </section>
        <hr style="margin-bottom: 30px; border: 0; border-top: 1px solid #eee;">
        <h2>Sản phẩm nổi bật</h2>
        <div class="products-grid" id="products">
            </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Cửa Hàng Sách - Nhóm 8. All rights reserved.</p>
    </footer>

    <script>
    // ==========================================
    // CẤU HÌNH ĐƯỜNG DẪN API (TRÁI TIM CỦA WEB)
    // ==========================================
    // Khi đang làm trên máy, dùng localhost. Khi nộp bài cho thầy, đổi thành link Render
    const API_BASE = "http://127.0.0.1:8000/api"; 
    // const API_BASE = "https://nhom8-backend-laravel.onrender.com/api"; 

    let books = []; // Mảng chứa sách lấy từ Backend

    // ==========================================
    // 1. LẤY DANH SÁCH SINH VIÊN TỪ BACKEND
    // ==========================================
    function loadStudentData() {
        fetch(`${API_BASE}/users`)
            .then(result => result.json())
            .then(data => {
                let html = "";
                data.forEach(user => {
                    html += `
                        <tr>
                            <td style="text-align: center;">${user.id}</td>
                            <td>${user.name}</td>
                        </tr>
                    `;
                });
                document.getElementById("du-lieu").innerHTML = html;
            })
            .catch(error => {
                document.getElementById("du-lieu").innerHTML = '<tr><td colspan="2" style="text-align:center; color:red;">Chưa bật máy chủ Laravel (php artisan serve)...</td></tr>';
            });
    }

    // ==========================================
    // 2. LẤY DANH SÁCH SÁCH TỪ BACKEND LARAVEL
    // ==========================================
    function loadBooks() {
        fetch(`${API_BASE}/books`)
            .then(res => res.json())
            .then(data => {
                books = data; // Lưu sách từ database vào biến
                if (books.length === 0) {
                    document.getElementById('products').innerHTML = '<p style="text-align: center; color: #999; grid-column: 1/-1;">Kho sách đang trống!</p>';
                } else {
                    displayProducts();
                }
            })
            .catch(err => console.error("Lỗi tải sách:", err));
    }

    function displayProducts() {
        const productsDiv = document.getElementById('products');
        productsDiv.innerHTML = books.map(book => {
            // Định dạng lại giá tiền từ số (150000) thành chữ (150.000đ)
            let formattedPrice = new Intl.NumberFormat('vi-VN').format(book.price) + 'đ';
            
            return `
            <div class="product-card">
                <div class="product-image">
                    <img src="img/${book.image}" alt="${book.title}" onerror="this.src='img/java.jpg'">
                    <button class="btn-wishlist" onclick="toggleWishlist(${book.id}, '${book.title}')">
                        <span class="heart" id="heart-${book.id}">♡</span>
                    </button>
                </div>
                <div class="product-info">
                    <div class="product-title">${book.title}</div>
                    <div class="product-author">Tác giả: ${book.author}</div>
                    <div class="product-price">${formattedPrice}</div>
                    <div class="product-actions">
                        <button class="btn btn-add-cart" onclick="addToCart(${book.id}, '${book.title}', ${book.price})">🛒 Thêm vào giỏ</button>
                    </div>
                </div>
            </div>
        `}).join('');
        updateWishlistUI();
    }

    // ==========================================
    // 3. ĐĂNG KÝ VÀ ĐĂNG NHẬP BẰNG API LARAVEL
    // ==========================================
    function register() {
        const name = prompt("Nhập tên hiển thị của bạn:");
        if (!name) return;
        const email = prompt("Nhập email đăng ký (Ví dụ: phuong@gmail.com):");
        if (!email) return;
        const password = prompt("Nhập mật khẩu (Ít nhất 6 ký tự):");
        if (!password) return;

        // Bắn dữ liệu lên Backend
        fetch(`${API_BASE}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, email: email, password: password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                alert("✓ " + data.message + " Vui lòng bấm Đăng nhập!");
            } else {
                alert("❌ Đăng ký thất bại! Email có thể đã tồn tại hoặc mật khẩu quá ngắn.");
            }
        });
    }

    function login() {
        const email = prompt("Nhập email:");
        if (!email) return;
        const password = prompt("Nhập mật khẩu:");
        if (!password) return;

        // Bắn dữ liệu lên Backend kiểm tra
        fetch(`${API_BASE}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                // Đăng nhập thành công, lưu tên user vào trình duyệt để hiển thị
                localStorage.setItem('user', data.user.name);
                updateAuthUI();
                alert("✓ " + data.message + " Chào mừng " + data.user.name);
            } else {
                alert("❌ " + data.message); // Báo sai mật khẩu
            }
        });
    }

    function logout() {
        localStorage.removeItem('user');
        updateAuthUI();
        alert("✓ Đăng xuất thành công!");
    }

    function updateAuthUI() {
        const user = localStorage.getItem('user');
        const loginBtn = document.querySelector('.btn-login');
        const registerBtn = document.querySelector('.btn-register');
        const logoutBtn = document.querySelector('.btn-logout');
        
        if (user) {
            loginBtn.style.display = 'none';
            registerBtn.style.display = 'none';
            logoutBtn.style.display = 'block';
            logoutBtn.textContent = `Đăng xuất (${user})`;
        } else {
            loginBtn.style.display = 'block';
            registerBtn.style.display = 'block';
            logoutBtn.style.display = 'none';
        }
    }

    // ==========================================
    // 4. CHỨC NĂNG GIỎ HÀNG (Lưu tạm trên trình duyệt)
    // ==========================================
    function getCart() { return JSON.parse(localStorage.getItem('cart') || '[]'); }
    function saveCart(cart) { localStorage.setItem('cart', JSON.stringify(cart)); updateCartBadge(); }

    function addToCart(id, title, price) {
        const cart = getCart();
        const existingItem = cart.find(item => item.id === id);
        if (existingItem) existingItem.quantity += 1;
        else cart.push({ id, title, price, quantity: 1 });
        saveCart(cart);
        alert(`✓ Đã thêm "${title}" vào giỏ hàng!`);
    }

    function updateCartBadge() {
        const cart = getCart();
        document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function showCart() {
        const cart = getCart();
        if (cart.length === 0) return alert('Giỏ hàng trống!');
        
        let text = 'GIỎ HÀNG:\n\n';
        let total = 0;
        cart.forEach(item => {
            total += (item.price * item.quantity);
            text += `${item.title} (x${item.quantity}): ${new Intl.NumberFormat('vi-VN').format(item.price * item.quantity)}đ\n`;
        });
        text += `\nTổng thanh toán: ${new Intl.NumberFormat('vi-VN').format(total)}đ\n\nBấm OK để thanh toán`;
        
        if (confirm(text)) {
            if (!localStorage.getItem('user')) {
                alert('Vui lòng đăng nhập để thanh toán!');
                return login();
            }
            alert('Thanh toán thành công!');
            localStorage.removeItem('cart');
            updateCartBadge();
        }
    }

    // ==========================================
    // KHỞI CHẠY TẤT CẢ KHI MỞ TRANG WEB
    // ==========================================
    window.addEventListener('load', function() {
        loadStudentData(); // Gọi API Sinh viên
        loadBooks();       // Gọi API Sách
        updateAuthUI();    // Hiện nút đăng nhập
        updateCartBadge(); // Hiện số lượng giỏ hàng
    });
</script>
</body>
</html>
